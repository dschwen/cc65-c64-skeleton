# Builds the cartridge and runs the VICE regression under Xvfb.
#
# Oscar64 and VICE are built from source and cached: the Debian/Ubuntu
# `vice` package ships without the C64 ROM images the emulator needs, and
# Oscar64 has no distro package. Both builds take several minutes the first
# time; later runs restore them from the cache.
name: CI

on:
  push:
  pull_request:

env:
  OSCAR64_REF: main
  VICE_VERSION: "3.8"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake pkg-config flex bison xa65 dos2unix \
            libgtk-3-dev libglew-dev libpulse-dev libasound2-dev libpng-dev libgif-dev libjpeg-dev \
            xvfb python3 python3-xlib

      - name: Python unit tests
        run: python3 tools/test_compile_script.py

      - name: Cache Oscar64
        id: cache-oscar64
        uses: actions/cache@v4
        with:
          path: ~/oscar64
          key: oscar64-${{ runner.os }}-${{ env.OSCAR64_REF }}-v2

      - name: Build Oscar64
        if: steps.cache-oscar64.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OSCAR64_REF" https://github.com/drmortalwombat/oscar64.git ~/oscar64
          # oscar64.md "Building": the makefile lives in make/ and the
          # `compiler` target skips the samples; it links to bin/oscar64.
          cd ~/oscar64
          make -C make compiler -j"$(nproc)"
          test -x bin/oscar64

      - name: Cache VICE
        id: cache-vice
        uses: actions/cache@v4
        with:
          path: ~/vice-install
          key: vice-${{ runner.os }}-${{ env.VICE_VERSION }}-v1

      - name: Build VICE (x64sc, c1541)
        if: steps.cache-vice.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o vice.tar.gz \
            "https://sourceforge.net/projects/vice-emu/files/releases/vice-${VICE_VERSION}.tar.gz/download"
          tar xzf vice.tar.gz
          cd "vice-${VICE_VERSION}"
          ./configure --prefix="$HOME/vice-install" --enable-gtk3ui --disable-pdf-docs --without-oss
          make -j"$(nproc)"
          make install

      - name: Build cartridge
        run: make OSCAR64="$HOME/oscar64/bin/oscar64"

      - name: Regression test under Xvfb
        run: |
          export PATH="$HOME/vice-install/bin:$PATH"
          make OSCAR64="$HOME/oscar64/bin/oscar64" test 2>&1 | tee test.log

      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartridge-and-test-output
          path: |
            build/game.crt
            build/game.map
            test.log
            /tmp/oscar-boot-*/
          if-no-files-found: ignore
