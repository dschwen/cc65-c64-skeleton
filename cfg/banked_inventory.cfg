# Inventory service executed directly from EasyFlash bank 48 ROMH. Its code
# and constants are read-only; all mutable state is imported from the main
# image's always-visible $C174-$C178 allocation.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    BANKED:  file = %O, start = $A000, size = $2000;
}

SEGMENTS {
    ENTRY:    load = BANKED, type = ro;
    CODE:     load = BANKED, type = ro, optional = yes;
    RODATA:   load = BANKED, type = ro, optional = yes;
    DATA:     load = BANKED, type = ro, optional = yes;
    ZEROPAGE: load = ZP,     type = zp, optional = yes;
}
