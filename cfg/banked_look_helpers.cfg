# Look-helper service executed directly from bank 47 ROML. Mutable formatting
# and precomputed collision state borrow low resident room-staging RAM.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    BANKED:  file = %O, start = $9300, size = $0C80;
}

SEGMENTS {
    ENTRY:    load = BANKED, type = ro;
    CODE:     load = BANKED, type = ro, optional = yes;
    RODATA:   load = BANKED, type = ro, optional = yes;
    DATA:     load = BANKED, type = ro, optional = yes;
    ZEROPAGE: load = ZP,     type = zp, optional = yes;
}
