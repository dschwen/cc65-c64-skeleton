# Room-helper service executed directly from bank 47 ROML at the address
# generated from cfg/easyflash_layout.json. It owns no mutable storage; the
# resident wrapper stages parameters/results below $8000.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    BANKED:  file = %O, start = $84C0, size = $0340;
}

SEGMENTS {
    ENTRY:    load = BANKED, type = ro;
    CODE:     load = BANKED, type = ro, optional = yes;
    RODATA:   load = BANKED, type = ro, optional = yes;
    DATA:     load = BANKED, type = ro, optional = yes;
    ZEROPAGE: load = ZP,     type = zp, optional = yes;
}
