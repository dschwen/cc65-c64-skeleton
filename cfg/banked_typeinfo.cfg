# Banked module executed in place from an EasyFlash bank - never copied into
# RAM, unlike the $A4E9 overlays. Linked at its run address inside the ROML
# window ($8000-$9FFF), which must match where tools/pack_easyflash.py places
# it: CPU address = $8000 + offset within the bank's ROML half.
#
# No BSS: this is ROM at run time. Any state it needs lives resident, below
# $8000, where it stays visible while the bank is mapped.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    BANKED:  file = %O, start = $9A00, size = $0600;
}

SEGMENTS {
    ENTRY:    load = BANKED, type = ro;
    CODE:     load = BANKED, type = ro, optional = yes;
    RODATA:   load = BANKED, type = ro, optional = yes;
    DATA:     load = BANKED, type = ro, optional = yes;
    ZEROPAGE: load = ZP,     type = zp, optional = yes;
}
