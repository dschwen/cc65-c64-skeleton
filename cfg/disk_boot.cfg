MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    START:    file = %O, fill = yes, start = $0801, size = $0020;
    RELOCLOAD:file = %O, start = $0821, size = $0100;
    RELOCRUN: file = "", start = $0200, size = $0100;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    START:    load = START,    type = ro;
    RELOC:    load = RELOCLOAD, run = RELOCRUN, type = ro, define = yes;
}
