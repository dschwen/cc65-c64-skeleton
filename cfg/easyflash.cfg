# Three populated 16 KiB EasyFlash banks. cartconv supplies the cartridge
# structure and omits all remaining erased banks from the CRT image.

MEMORY {
    BANK0: file = %O, start = $8000, size = $4000,
           fill = yes, fillval = $FF;
    BANK1: file = %O, start = $8000, size = $4000,
           fill = yes, fillval = $FF;
    BANK2: file = %O, start = $8000, size = $4000,
           fill = yes, fillval = $FF;
}

SEGMENTS {
    CART_HEADER: load = BANK0, type = ro, start = $8000;
    BOOT:        load = BANK0, type = ro;
    PAYLOAD0:    load = BANK0, type = ro, start = $8200;
    PAYLOAD1:    load = BANK1, type = ro, start = $8000;
    PAYLOAD2:    load = BANK2, type = ro, start = $8000;

    # In EasyFlash's reset-time Ultimax mode, physical ROMH offsets
    # $1FFA-$1FFF appear at CPU addresses $FFFA-$FFFF.
    VECTORS:     load = BANK0, type = ro, start = $BFFA;
}
