# One populated 16 KiB EasyFlash bank. cartconv supplies the remaining
# cartridge structure and omits empty banks from the CRT image.

MEMORY {
    CART: file = %O, start = $8000, size = $4000,
          fill = yes, fillval = $FF;
}

SEGMENTS {
    CART_HEADER: load = CART, type = ro, start = $8000;
    BOOT:        load = CART, type = ro;
    PAYLOAD:     load = CART, type = ro, start = $8100;

    # In EasyFlash's reset-time Ultimax mode, physical ROMH offsets
    # $1FFA-$1FFF appear at CPU addresses $FFFA-$FFFF.
    VECTORS:     load = CART, type = ro, start = $BFFA;
}
