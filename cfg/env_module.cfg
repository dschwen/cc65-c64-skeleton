# Room environment module ("RE" resource, see src/platform.h's
# PLATFORM_RESOURCE_KIND_ENVIRONMENT and rooms/env/). Linked at a fixed
# origin matching ENVCODE_BASE (src/platform.inc) since the output is
# copied there verbatim at runtime, unlike a normal $B000 overlay - there is
# no relocating loader here, just platform_resource_fetch() into fixed RAM.
# No header/BSS/checksum patching step either: the generic resource
# directory (tools/pack_easyflash.py) already checksums and size-validates
# the whole file, so the linked output *is* the final resource content.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    ENVCODE: file = %O, start = $7E00, size = $0200;
}

SEGMENTS {
    CODE:     load = ENVCODE, type = ro;
    RODATA:   load = ENVCODE, type = ro, optional = yes;
    DATA:     load = ENVCODE, type = rw, optional = yes;
    ZEROPAGE: load = ZP,      type = zp, optional = yes;
}
