# C64 layout with two VIC-visible character sets in bank 0.
#
# $0400-$07E7  screen RAM (owned by the KERNAL/VIC, not the linker)
# $0801-$1FFF  BASIC stub, program, and initialized data
# $2000-$27FF  tile charset (editor bank 0)
# $2800-$2FFF  text charset (editor bank 1)
# $3000-$38FF  tile definitions and properties
# $3900-$39FF  small read-only lookup tables
# $3A00-$3BFF  runtime sprite overlay bitmap storage
# $3C00-$7FFF  platform code and read-only tables
# $8000-$84E8  current room RAM
# $84E9-$85FF  fixed game state
# $8600-$89FF  load padding / room-overlay headroom
# $8A00-$8EFF  resident upper code
# $9200-$9FFF  active room-code overlay
# $A000-$A4E8  staged destination room
# $A4E9-$BFFF  gameplay work RAM / staged room code
# $B500-$B848  resident BSS
# $B900-$BBFF  cc65 software stack
# $C000-$FFFF  256 object-type records (RAM beneath I/O/KERNAL)

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0300;
}

MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O,               start = %S - 2, size = $0002;
    HEADER:   file = %O, define = yes, start = %S,     size = $000D;
    PROGRAM:  file = %O, fill = yes,   start = __HEADER_LAST__,
              size = $2000 - __HEADER_LAST__;
    CHARSETS: file = %O, fill = yes,   start = $2000, size = $1000;
    TILEMEM:  file = %O,               start = $3000, size = $0900;
    MID:      file = %O, fill = yes,   start = $3900, size = $0100;
    GAP:      file = %O, fill = yes,   start = $3A00, size = $0200;
    HIGH:     file = %O, fill = yes,   start = $3C00, size = $4400;

    # The C64 startup uses MAIN_START + MAIN_SIZE as the C stack top.
    MAIN:     file = "", define = yes, start = $B900, size = $0300;
    ROOMRAM:  file = %O, fill = yes, define = yes,
              start = $8000, size = $04E9;
    GAMESTATE: file = %O, fill = yes, define = yes,
              start = $84E9, size = $0117;
    UPPAD:    file = %O, fill = yes,   start = $8600, size = $0400;
    UPPER:    file = %O,               start = $8A00, size = $0500;
    ROOMSTAGE: file = "", define = yes, start = $A000, size = $04E9;
    WORKRAM:  file = "", define = yes, start = $A4E9, size = $1B17;
    BSSRAM:   file = "",               start = $B500, size = $0400;
    TYPERAM:  file = "", define = yes, start = $C000, size = $4000;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = PROGRAM,  type = ro;
    LOWCODE:  load = PROGRAM,  type = ro, optional = yes;
    CODE:     load = PROGRAM,  type = ro;
    RODATA:   load = PROGRAM,  type = ro;
    DATA:     load = PROGRAM,  type = rw;
    INIT:     load = PROGRAM,  type = rw;
    ONCE:     load = PROGRAM,  type = ro, define = yes;
    CHARSETS: load = CHARSETS, type = ro;
    TILESET:  load = TILEMEM,  type = ro;
    MIDRODATA: load = MID,     type = ro, optional = yes;
    MIDCODE:  load = MID,      type = ro, optional = yes;
    HIGHCODE: load = HIGH,     type = ro, optional = yes;
    HIGHRODATA: load = HIGH,   type = ro, optional = yes;
    BSS:      load = BSSRAM,   type = bss, define = yes;
    UPPERCODE: load = UPPER,   type = ro, optional = yes;
    UPPERRODATA: load = UPPER, type = ro, optional = yes;
    ROOMBSS:  load = ROOMRAM,  type = bss, define = yes;
    GAMESTATE: load = GAMESTATE, type = bss;
    ROOMSTAGE: load = ROOMSTAGE, type = bss;
    WORKBSS:  load = WORKRAM,  type = bss, optional = yes;
    OBJECTTYPES: load = TYPERAM, type = bss, define = yes;
}

FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
