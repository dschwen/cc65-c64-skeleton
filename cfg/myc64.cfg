; myc64.cfg - starter linker configuration for C64
;
; This is intentionally conservative and similar to the standard C64 layout:
; - Program loads at $0801
; - Code/data live above the BASIC header
;
; You can evolve this by adding fixed-address segments for assets (CHARSET, SPRITES, MUSIC, etc.)
;
; NOTE: This is a starter; for advanced layouts, copy and modify the official c64.cfg from cc65.

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400; ; 1 KB stack
}

MEMORY {
    ZP:     start = $0002, size = $001A, type = rw, define = yes;
    LOAD:   start = $0801, size = $9F00, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;

    STARTUP:  load = LOAD, type = ro;
    LOWCODE:  load = LOAD, type = ro, optional = yes;
    ONCE:     load = LOAD, type = ro, optional = yes;
    CODE:     load = LOAD, type = ro;
    RODATA:   load = LOAD, type = ro;
    DATA:     load = LOAD, type = rw;
    BSS:      load = LOAD, type = bss, define = yes;

    ; Optional: a segment you can place assets into later.
    ; ASSETS: load = LOAD, type = ro, optional = yes;
}
