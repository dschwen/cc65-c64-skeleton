# C64 layout with screen, sprites, and two character sets in VIC bank 3.
#
# $0400-$07FF  free of game display ownership (KERNAL-compatible RAM)
# $0801-$1FFF  BASIC stub, program, and initialized data
# $2000-$23FF  current room RAM
# $2400-$27FF  destination-room staging
# $2800-$2BFF  sparse room-object delta journal
# $2C00-$2EFF  resident BSS
# $2F00-$2F9F  compact resident native helpers
# $2FA0-$2FFF  rain/water setup code plus a 30-byte tail
# $3000-$38FF  tile definitions and properties
# $3900-$39FF  small read-only lookup tables
# $3A00-$3BFF  independently loaded resident SID/text/validator module
# $3C00-$7FFF  platform code and read-only tables
# $8000-$85FF  reserved fill before resident upper code
# $8600-$8B47  resident world-state code
# $8B48-$98FF  resident game/main and shared room-API code
# $9900-$9CFF  active room-code overlay
# $9D00-$9FFF  pristine current-room object baseline
# $A000-$A479  save record/index scratch; remaining `$A000-$AFFF` free
# $B000-$BFFF  gameplay work RAM, staging, and remaining loaded overlays
# $C000-$C0FF  cc65 software stack
# $C100-$C173  fixed game state
# $C180-$CFFF  hot object-type records (always visible)
# $D000-$DFFE  hot object-type records, types 106-222 (RAM beneath I/O)
# $E000-$E482  hot object-type records, types 223-255 (RAM beneath KERNAL)
# $E483-$E7FF  free RAM beneath KERNAL
# $E800-$EFFF  tile charset (VIC bank 3)
# $F000-$F7FF  text charset (VIC bank 3)
# $F800-$FBFF  screen matrix and sprite pointers (VIC bank 3)
# $FC00-$FDFF  cursor/portrait/rain sprite bitmaps (VIC bank 3)
# $FE00-$FFF9  free RAM beneath KERNAL
# $FFFA-$FFFF  direct NMI/reset/IRQ RAM vectors

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200;
}

MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001E;
    LOADADDR: file = %O,               start = %S - 2, size = $0002;
    HEADER:   file = %O, define = yes, start = %S,     size = $000D;
    PROGRAM:  file = %O, fill = yes,   start = __HEADER_LAST__,
              size = $2000 - __HEADER_LAST__;
    # The VIC-bank move frees the old low charsets for always-visible mutable
    # state. These regions remain file-backed/fill because TILEMEM and the
    # resident code above it still follow in the contiguous PRG image.
    ROOMRAM:  file = %O, fill = yes, define = yes,
              start = $2000, size = $0400;
    ROOMSTAGE: file = %O, fill = yes, define = yes,
              start = $2400, size = $0400;
    WORLDDELTA: file = %O, fill = yes, start = $2800, size = $0400;
    BSSRAM:   file = %O, fill = yes, start = $2C00, size = $0300;
    STATEEXT: file = %O, fill = yes, start = $2F00, size = $00A0;
    RAINMEM:  file = %O, fill = yes, start = $2FA0, size = $0060;
    TILEMEM:  file = %O, fill = yes,   start = $3000, size = $0900;
    MID:      file = %O, fill = yes,   start = $3900, size = $0100;
    TEXTGAP:  file = %O, fill = yes,   start = $3A00, size = $0200;
    HIGH:     file = %O, fill = yes,   start = $3C00, size = $4200;
    # The current room's environment module (weather + ambient sound, see
    # PLATFORM_API.md's "Room environment module") is copied here at runtime
    # via platform_resource_fetch(), never linked in by cc65 - no segment
    # loads here (see the SEGMENTS block). fill=yes anyway (not file=""):
    # this sits between two other file=%O areas (HIGH before, ROOMRAM/
    # ROOMBSS after) in one contiguous PRG, so it still needs real
    # (throwaway) bytes reserving its place in the file, exactly like
    # ROOMBSS/GAMESTATE/etc below despite those being pure BSS too - only
    # MAIN's position (surrounded by other already-gapped regions) gets away
    # with file="". Carved from HIGH's own tail (shrunk by exactly this much
    # above) rather than given fresh address space, so it's unaffected by
    # EasyFlash or KERNAL/BASIC banking exactly like the rest of HIGH -
    # required, since the resident raster IRQ calls into it every frame and
    # can never bank-switch to reach it.
    ENVCODE:  file = %O, fill = yes,   start = $7E00, size = $0200;

    # The C64 startup uses MAIN_START + MAIN_SIZE as the C stack top.
    # $C000-$CFFF is the only RAM above $8000 that stays visible under every
    # memory map a far call passes through ($8000-$BFFF becomes cartridge ROM,
    # and in 8K mode BASIC ROM covers $A000-$BFFF instead) - so the software
    # stack has to live here for banked code to be able to use it at all.
    # 256 bytes against a measured peak of 37 across boot, the inventory
    # overlay and Look; the old 512 at $BA00 was ~14x oversized.
    MAIN:     file = "", define = yes, start = $C000, size = $0100;
    # The display moved out of the EasyFlash-visible bank entirely. This fill
    # remains only because resident code resumes at $8600 in the same PRG.
    VICGAP:   file = %O, fill = yes, start = $8000, size = $0600;
    SAVEUPPER: file = %O, fill = yes,  start = $8600, size = $0548;
    UPPER:    file = %O,               start = $8B48, size = $0DB8;
    ROOMBASE: file = "",               start = $9D00, size = $0300;
    WORKRAM:  file = "", define = yes, start = $B000, size = $1000;
    # Hot object-type records (35 bytes each) at a fixed stride across the
    # three memory-shadow zones; see platform.c's OBJECT_TYPE_ZONE_* comment.
    # 117*35=4095 leaves 1 free byte before each of $D000/$E000; the object
    # table no longer reaches $E302-$FFF9, which is genuinely free RAM.
    # GameState lives beside the software stack in the only RAM above $8000
    # that stays visible under every map a far call passes through, so banked
    # code can read game state directly instead of being handed copies.
    # GameState itself ends at $C173. The remaining bytes through $C17F own
    # the transient state of in-place banked services, keeping that state
    # visible while ROML/ROMH cover $8000-$BFFF.
    GAMESTATE: file = "", define = yes, start = $C100, size = $0080;
    TYPERAM:   file = "", define = yes, start = $C180, size = $0E80;
    TYPERAM_B: file = "", define = yes, start = $D000, size = $0FFF;
    TYPERAM_C: file = "", define = yes, start = $E000, size = $0483;
    # VIC bank 3 is outside the EasyFlash ROML/ROMH window. CPU reads of this
    # RAM disappear while KERNAL is mapped, but the VIC continues to see it;
    # banked UI code only writes the screen, and IRQ water reads use LOWBSS.
    CHARSETS: file = "", define = yes, start = $E800, size = $1000;
    VICDISPLAY: file = "", define = yes, start = $F800, size = $0600;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = PROGRAM,  type = ro;
    LOWCODE:  load = PROGRAM,  type = ro, optional = yes;
    # Data that banked code (or the bank machinery it calls) must be able to
    # read: below $8000, so it stays visible when $8000-$BFFF is cartridge ROM.
    LOWBSS:   load = PROGRAM,  type = bss, optional = yes;
    CODE:     load = PROGRAM,  type = ro;
    RODATA:   load = PROGRAM,  type = ro;
    DATA:     load = PROGRAM,  type = rw;
    INIT:     load = PROGRAM,  type = rw;
    ONCE:     load = PROGRAM,  type = ro, define = yes;
    CHARSETS: load = CHARSETS, type = bss;
    TILESET:  load = TILEMEM,  type = bss;
    MIDRODATA: load = MID,     type = ro, optional = yes;
    MIDCODE:  load = MID,      type = ro, optional = yes;
    RAINCODE: load = RAINMEM, type = ro;
    HIGHCODE: load = HIGH,     type = ro, optional = yes;
    HIGHRODATA: load = HIGH,   type = ro, optional = yes;
    BSS:      load = BSSRAM,   type = bss, define = yes;
    UPPERCODE: load = UPPER,   type = ro, optional = yes;
    UPPERRODATA: load = UPPER, type = ro, optional = yes;
    SAVECODE: load = SAVEUPPER, type = ro, optional = yes;
    ROOMBSS:  load = ROOMRAM,  type = bss, define = yes;
    GAMESTATE: load = GAMESTATE, type = bss;
    STATEEXT: load = STATEEXT, type = ro, optional = yes;
    ROOMSTAGE: load = ROOMSTAGE, type = bss;
    WORKBSS:  load = WORKRAM,  type = bss, optional = yes;
    ROOMBASE: load = ROOMBASE, type = bss, optional = yes;
    WORLDDELTA: load = WORLDDELTA, type = bss, optional = yes;
    OBJECTTYPES: load = TYPERAM, type = bss, define = yes;
    OBJECTTYPES_B: load = TYPERAM_B, type = bss, define = yes;
    OBJECTTYPES_C: load = TYPERAM_C, type = bss, define = yes;
}

FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
