# Independently loaded room-helpers overlay. Shares the common
# $A4E9-$B4FF work/overlay window; none of the $A4E9
# overlays ever run at once. It runs synchronously from resident code (never
# from a room's own banked-in code - see modules/room_helpers.c), so it must
# return before the resident engine needs $A4E9 for anything else.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    HEADER:  file = %O, start = $A4E7, size = $0002;
    OVERLAY: file = %O, start = $A4E9, size = $1017;
}

SEGMENTS {
    LOADADDR:           load = HEADER,  type = ro;
    ROOMHELPERSHEADER:  load = OVERLAY, type = ro;
    CODE:               load = OVERLAY, type = ro, optional = yes;
    RODATA:             load = OVERLAY, type = ro, optional = yes;
    DATA:               load = OVERLAY, type = rw, optional = yes;
    BSS:                load = OVERLAY, type = bss, optional = yes, define = yes;
    ZEROPAGE:           load = ZP,      type = zp, optional = yes;
}
