# Independently linked room code. Every room occupies the same runtime window.

MEMORY {
    ZP:   file = "", start = $0002, size = $001A;
    ROOM: file = %O, start = $9900, size = $0400;
}

SEGMENTS {
    ROOMHEADER: load = ROOM, type = ro;
    CODE:       load = ROOM, type = ro, optional = yes;
    RODATA:     load = ROOM, type = ro, optional = yes;
    DATA:       load = ROOM, type = rw, optional = yes;
    BSS:        load = ROOM, type = bss, optional = yes, define = yes;
    ZEROPAGE:   load = ZP,   type = zp, optional = yes;
}
