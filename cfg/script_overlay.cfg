# Independently loaded script/conversation interpreter overlay. Shares the
# common $B000-$BFFF work/overlay window;
# none of the loaded overlays ever run at once. It runs synchronously from
# resident code (never from a room's own banked-in code - see
# modules/script.c), so it must return before the resident engine needs
# $B000 for anything else.
MEMORY {
    ZP:      file = "", start = $0002, size = $001A;
    HEADER:  file = %O, start = $AFFE, size = $0002;
    OVERLAY: file = %O, start = $B000, size = $1000;
}

SEGMENTS {
    LOADADDR:      load = HEADER,  type = ro;
    SCRIPTHEADER:  load = OVERLAY, type = ro;
    CODE:          load = OVERLAY, type = ro, optional = yes;
    RODATA:        load = OVERLAY, type = ro, optional = yes;
    DATA:          load = OVERLAY, type = rw, optional = yes;
    BSS:           load = OVERLAY, type = bss, optional = yes, define = yes;
    ZEROPAGE:      load = ZP,      type = zp, optional = yes;
}
