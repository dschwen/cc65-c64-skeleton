# Independently loaded resident helpers and bottom-text pager. The first two
# output bytes form the normal CBM PRG load-address header; EasyFlash
# packaging strips that header.
MEMORY {
    HEADER: file = %O, start = $39FE, size = $0002;
    PRETEXT: file = %O, start = $3A00, size = $0073,
             fill = yes, fillval = $00;
    TEXT:   file = %O, start = $3A73, size = $014A;
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    PRETEXT:  load = PRETEXT, type = ro, optional = yes;
    TEXTCODE: load = TEXT,   type = ro;
}
