# Independently loaded bottom-text pager. The first two output bytes form the
# normal CBM PRG load-address header; EasyFlash packaging strips that header.
MEMORY {
    HEADER: file = %O, start = $B87E, size = $0002;
    TEXT:   file = %O, start = $B880, size = $0180;
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    TEXTCODE: load = TEXT,   type = ro;
}
